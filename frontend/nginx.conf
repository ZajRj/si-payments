server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: resuelve el backend aunque su contenedor se recree.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    # Se usa el nombre del contenedor (único en el host) y no el del servicio: en una red
    # compartida como portainer_network, el alias «backend» puede apuntar a otro stack.
    set $backend http://facyt_payments_back:3000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Fallback de la SPA: vue-router resuelve las rutas en el navegador.
  location / {
    add_header Cache-Control "no-cache";
    # nginx no hereda add_header del server si el location define los suyos: se repiten aquí.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
